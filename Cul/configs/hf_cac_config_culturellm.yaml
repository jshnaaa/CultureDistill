# HF-CAC Configuration for CultureLLM Dataset
#
# CultureLLM task: World Values Survey (WVS) attitude questions.
#   - Questions ask about cultural values, attitudes, and social norms
#   - Answer options vary per question (2-way to 10-way scales)
#   - The task is to predict the MOST REPRESENTATIVE attitude
#     of a given culture/country (not factual knowledge, but value alignment)
#   - Countries: China, United States, Germany, Greece, South Korea,
#     Portugal, Spain, Turkey, Bangladesh, Arabic (Iraq & Jordan)
#
# Key difference from CulturalBench:
#   - CulturalBench = factual cultural knowledge QA (fixed 4-way MCQ)
#   - CultureLLM = cultural VALUES/ATTITUDES prediction (variable-scale survey)
#   - Requires agents to reason about cultural worldviews, not recall facts
#
# DESIGN: Concise MAD-inspired prompts, with emphasis on cultural value reasoning.
# System prompt remains a one-liner. Task-specific guidance in user prompts.

num_agents: 6
num_debate_rounds: 0
temperature: 0.9
max_tokens: 512

# ---------------------------------------------------------------------------
# Cultural Affinity Matrix (6x6)
# ---------------------------------------------------------------------------
cultural_affinity_matrix:
  - [1.0, 0.4, 0.1, 0.2, 0.2, 0.1]   # Western & Anglo-Saxon
  - [0.4, 1.0, 0.3, 0.1, 0.2, 0.2]   # Latin American
  - [0.1, 0.3, 1.0, 0.1, 0.5, 0.2]   # Sub-Saharan African
  - [0.2, 0.1, 0.1, 1.0, 0.2, 0.5]   # East-Asian
  - [0.2, 0.2, 0.5, 0.2, 1.0, 0.4]   # Islamic & Middle-Eastern
  - [0.1, 0.2, 0.2, 0.5, 0.4, 1.0]   # South & Southeast Asian

guardian_failure_indicators:
  - "I'm not sure"
  - "I don't have enough knowledge"
  - "I cannot determine"
  - "I lack sufficient"
  - "uncertain about this"
  - "not familiar with"

# ---------------------------------------------------------------------------
# Task type identifier
# ---------------------------------------------------------------------------
task_type: "culturellm"
# answer_choices is dynamic (varies per question), not fixed here
# max_choice is determined at runtime from each question's option range

# ---------------------------------------------------------------------------
# 6 Heterogeneous Cultural Agents
#
# System prompts: MAD-style one-liner (simple, avoids role-play bias).
# The user prompt (built in code) provides all task-specific instructions.
#
# region_keywords cover CultureLLM's 10 countries/regions:
#   United States → Western & Anglo-Saxon
#   Germany → Western & Anglo-Saxon
#   Greece → Western & Anglo-Saxon
#   Portugal → Western & Anglo-Saxon
#   Spain → Western & Anglo-Saxon
#   China → East-Asian
#   South Korea → East-Asian
#   Turkey → Islamic & Middle-Eastern
#   Arabic (Iraq & Jordan) → Islamic & Middle-Eastern
#   Bangladesh → South & Southeast Asian
# ---------------------------------------------------------------------------
