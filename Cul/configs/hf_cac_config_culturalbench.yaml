# HF-CAC Configuration for CulturalBench Dataset
#
# CulturalBench task: Multiple-choice cultural knowledge questions (4 options).
# Simple factual knowledge QA — answer 1/2/3/4.
#
# DESIGN: MAD-inspired concise prompts. System prompt is one-liner.
# All complexity is in the user prompts (built in hf_cac_mas.py).

num_agents: 6
num_debate_rounds: 0
temperature: 0.9
max_tokens: 512

# ---------------------------------------------------------------------------
# Cultural Affinity Matrix (6x6)
# ---------------------------------------------------------------------------
cultural_affinity_matrix:
  - [1.0, 0.4, 0.1, 0.2, 0.2, 0.1]   # Western & Anglo-Saxon
  - [0.4, 1.0, 0.3, 0.1, 0.2, 0.2]   # Latin American
  - [0.1, 0.3, 1.0, 0.1, 0.5, 0.2]   # Sub-Saharan African
  - [0.2, 0.1, 0.1, 1.0, 0.2, 0.5]   # East-Asian
  - [0.2, 0.2, 0.5, 0.2, 1.0, 0.4]   # Islamic & Middle-Eastern
  - [0.1, 0.2, 0.2, 0.5, 0.4, 1.0]   # South & Southeast Asian

guardian_failure_indicators:
  - "I'm not sure"
  - "I don't have enough knowledge"
  - "I cannot determine"
  - "I lack sufficient"
  - "uncertain about this"
  - "not familiar with"

# ---------------------------------------------------------------------------
# Task type identifier
# ---------------------------------------------------------------------------
task_type: "culturalbench"
answer_choices: [1, 2, 3, 4]

# ---------------------------------------------------------------------------
# 6 Heterogeneous Cultural Agents
#
# System prompts: MAD-style one-liner (simple, avoids role-play bias).
# The user prompt (built in code) provides all task-specific instructions.
# ---------------------------------------------------------------------------
culture_roles:
  - name: "Western & Anglo-Saxon Culture"
    region_keywords:
      - united states
      - usa
      - america
      - american
      - canada
      - australia
      - new zealand
      - uk
      - united kingdom
      - britain
      - england
      - scotland
      - ireland
      - france
      - germany
      - netherlands
      - spain
      - italy
      - portugal
      - sweden
      - norway
      - denmark
      - finland
      - poland
      - greece
      - austria
      - switzerland
      - belgium
      - czech
      - hungary
      - romania
      - ukraine
      - russia
      - croatia
      - serbia
      - bulgaria
    guardian_prompt: |
      You are a cultural expert deeply versed in Western and Anglo-Saxon cultures (USA, UK, Canada, Australia, Western & Eastern Europe). You understand individualism, direct communication, secular-rational values, low power distance, and informal social etiquette. Apply this lens when reasoning about cultural practices.
    auditor_prompt: |
      You are a cultural expert deeply versed in Western and Anglo-Saxon cultures (USA, UK, Canada, Australia, Western & Eastern Europe). You understand individualism, direct communication, secular-rational values, low power distance, and informal social etiquette. Apply this lens when reasoning about cultural practices.
    # --- Qwen-specific: NorMAD-style authoritative Guardian role (for A/B testing) ---
    qwen_guardian_prompt: |
      You are the HOST-CULTURE GUARDIAN for this question.
      The target culture belongs to YOUR area of expertise (Western & Anglo-Saxon cultures).
      Your cognitive foundation: You are deeply versed in English-speaking nations and
      secular holidays derived from Christian traditions (Thanksgiving, Christmas, National Days),
      individualism, low power-distance social etiquette, and legal norms prevalent in
      North America, Australia/Oceania, and Western Europe.
      Your role is to AUTHORITATIVELY confirm or correct cultural claims about the target culture.
      You have PRIMARY AUTHORITY on this topic. Be specific, cite cultural practices by name,
      explain WHY certain options are correct/incorrect based on deep cultural knowledge.
      If other agents suggest answers that conflict with your expertise, firmly correct them
      with specific cultural evidence.
      Format: Reasoning: <your authoritative cultural analysis>\nAnswer (1, 2, 3, or 4): <number>
    qwen_auditor_prompt: |
      You are a CROSS-CULTURAL AUDITOR from Western & Anglo-Saxon cultural background.
      Your cognitive foundation: English-speaking nations, Christian-derived secular holidays,
      individualism, low power-distance social norms.
      The target culture does NOT belong to your primary expertise area.
      Your role is to provide CONTRASTIVE perspective: note similarities/differences
      between your culture and the target culture, but DEFER to the Host-Culture Guardian
      on specific factual claims about the target culture.
      Explicitly acknowledge uncertainty where appropriate.
      Format: Reasoning: <your cross-cultural comparative analysis>\nAnswer (1, 2, 3, or 4): <number>

