# HF-CAC Configuration for CulturalBench Dataset
#
# CulturalBench task: Multiple-choice cultural knowledge questions (4 options).
# Simple factual knowledge QA — answer 1/2/3/4.
#
# DESIGN: MAD-inspired concise prompts. System prompt is one-liner.
# All complexity is in the user prompts (built in hf_cac_mas.py).

num_agents: 6
num_debate_rounds: 0
temperature: 0.9
max_tokens: 512

# ---------------------------------------------------------------------------
# Cultural Affinity Matrix (6x6)
# ---------------------------------------------------------------------------
cultural_affinity_matrix:
  - [1.0, 0.4, 0.1, 0.2, 0.2, 0.1]   # Western & Anglo-Saxon
  - [0.4, 1.0, 0.3, 0.1, 0.2, 0.2]   # Latin American
  - [0.1, 0.3, 1.0, 0.1, 0.5, 0.2]   # Sub-Saharan African
  - [0.2, 0.1, 0.1, 1.0, 0.2, 0.5]   # East-Asian
  - [0.2, 0.2, 0.5, 0.2, 1.0, 0.4]   # Islamic & Middle-Eastern
  - [0.1, 0.2, 0.2, 0.5, 0.4, 1.0]   # South & Southeast Asian

guardian_failure_indicators:
  - "I'm not sure"
  - "I don't have enough knowledge"
  - "I cannot determine"
  - "I lack sufficient"
  - "uncertain about this"
  - "not familiar with"

# ---------------------------------------------------------------------------
# Task type identifier
# ---------------------------------------------------------------------------
task_type: "culturalbench"
answer_choices: [1, 2, 3, 4]

# ---------------------------------------------------------------------------
# 6 Heterogeneous Cultural Agents
#
# System prompts: MAD-style one-liner (simple, avoids role-play bias).
# The user prompt (built in code) provides all task-specific instructions.
# ---------------------------------------------------------------------------
culture_roles:
  - name: "Western & Anglo-Saxon Culture"
    region_keywords:
      - united states
      - usa
      - america
      - american
      - canada
      - australia
      - new zealand
      - uk
      - united kingdom
      - britain
      - england
      - scotland
      - ireland
      - france
      - germany
      - netherlands
      - spain
      - italy
      - portugal
      - sweden
      - norway
      - denmark
      - finland
      - poland
      - greece
      - austria
      - switzerland
      - belgium
      - czech
      - hungary
      - romania
      - ukraine
      - russia
      - croatia
      - serbia
      - bulgaria
    guardian_prompt: |
      You are a cultural expert deeply versed in Western and Anglo-Saxon cultures (USA, UK, Canada, Australia, Western & Eastern Europe). You understand individualism, direct communication, secular-rational values, low power distance, and informal social etiquette. Apply this lens when reasoning about cultural practices.
    auditor_prompt: |
      You are a cultural expert deeply versed in Western and Anglo-Saxon cultures (USA, UK, Canada, Australia, Western & Eastern Europe). You understand individualism, direct communication, secular-rational values, low power distance, and informal social etiquette. Apply this lens when reasoning about cultural practices.
    # --- Qwen-specific: NorMAD-style authoritative Guardian role (for A/B testing) ---
    # [PRESERVED - v1 over-authority prompts]
    # qwen_guardian_prompt_v1: "You are the HOST-CULTURE GUARDIAN... PRIMARY AUTHORITY... firmly correct them"
    # qwen_auditor_prompt_v1: "DEFER to the Host-Culture Guardian on specific factual claims"
    qwen_guardian_prompt: |
      You are a cultural knowledge specialist for Western & Anglo-Saxon cultures.
      Your expertise covers English-speaking nations (USA, UK, Canada, Australia, NZ),
      Western Europe (France, Germany, Netherlands, Scandinavia), and Eastern Europe.
      You understand individualism, secular holidays (Thanksgiving, Christmas, National Days),
      low power-distance social etiquette, and legal/social norms in these regions.
      TASK: Analyze each option carefully against your cultural knowledge. Consider edge cases
      and common misconceptions. Do NOT rush to an answer — systematically evaluate why each
      option might or might not be correct for the specific country asked about.
      If you are uncertain, say so rather than guessing confidently.
      Format: Reasoning: <step-by-step analysis of each option>\nAnswer (1, 2, 3, or 4): <number>
    qwen_auditor_prompt: |
      You are an independent cultural analyst with expertise in Western & Anglo-Saxon cultures.
      Your background: English-speaking nations, Christian-derived secular holidays,
      individualism, low power-distance social norms, Western/Eastern European traditions.
      TASK: Answer this question using your own knowledge and reasoning. Do NOT simply
      defer to any other expert — form your own independent judgment. Analyze each option
      carefully and consider what specific cultural facts you know about the target country.
      If you disagree with others, state your reasoning clearly with evidence.
      Format: Reasoning: <your independent analysis>\nAnswer (1, 2, 3, or 4): <number>

