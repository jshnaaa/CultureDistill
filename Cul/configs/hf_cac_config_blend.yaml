# HF-CAC Configuration for BLEnD Dataset
#
# BLEnD (Benchmark of Linguistic and cultural Diversity):
#   - 16 countries/regions focused on everyday/daily cultural knowledge
#   - 4-choice MCQ format — answer 1/2/3/4
#   - Topics: daily habits, local food, festivals, part-time jobs, study resources, etc.
#   - Key difference from CulturalBench: more focused on "daily life" cultural trivia
#
# Extended region_keywords to cover BLEnD-specific regions:
#   - Azerbaijan → Islamic & Middle-Eastern (Turkic-Islamic culture)
#   - Assam → South & Southeast Asian (Indian subcontinent)
#   - North Korea → East-Asian (explicit entry)
#   - Northern Nigeria → Sub-Saharan African (explicit entry)
#
# DESIGN: BLEnD-specific prompts (task_type: blend).
# Key optimizations over generic culturalbench:
#   - Guardian/Auditor prompts reframed for factual daily-life recall
#   - Cross-country distractor warnings in prompts
#   - "not-applicable" awareness
#   - Higher Auditor temperature (0.7) to prevent excessive conformity
#   - num_agents=3 (1 Guardian + 2 Auditors) — empirically best diversity/consensus balance
#     (4+ agents cause Auditors to conform too readily, reducing corrective diversity)

num_agents: 3
num_debate_rounds: 0
temperature: 0.9
max_tokens: 512

# ---------------------------------------------------------------------------
# Cultural Affinity Matrix (6x6)
# ---------------------------------------------------------------------------
cultural_affinity_matrix:
  - [1.0, 0.4, 0.1, 0.2, 0.2, 0.1]   # Western & Anglo-Saxon
  - [0.4, 1.0, 0.3, 0.1, 0.2, 0.2]   # Latin American
  - [0.1, 0.3, 1.0, 0.1, 0.5, 0.2]   # Sub-Saharan African
  - [0.2, 0.1, 0.1, 1.0, 0.2, 0.5]   # East-Asian
  - [0.2, 0.2, 0.5, 0.2, 1.0, 0.4]   # Islamic & Middle-Eastern
  - [0.1, 0.2, 0.2, 0.5, 0.4, 1.0]   # South & Southeast Asian

guardian_failure_indicators:
  - "I'm not sure"
  - "I don't have enough knowledge"
  - "I cannot determine"
  - "I lack sufficient"
  - "uncertain about this"
  - "not familiar with"

# ---------------------------------------------------------------------------
# Task type identifier
# ---------------------------------------------------------------------------
task_type: "blend"
answer_choices: [1, 2, 3, 4]

# ---------------------------------------------------------------------------
# 6 Heterogeneous Cultural Agents
#
# System prompts: MAD-style one-liner (simple, avoids role-play bias).
# The user prompt (built in code) provides all task-specific instructions.
#
# region_keywords extended for BLEnD's 16 countries:
#   United States, United Kingdom, Spain, Greece → Western
#   Mexico → Latin American
#   Ethiopia, Northern Nigeria → Sub-Saharan African
#   China, South Korea, North Korea → East-Asian
#   Iran, Algeria, Azerbaijan → Islamic & Middle-Eastern
#   Indonesia, Assam → South & Southeast Asian
# ---------------------------------------------------------------------------
